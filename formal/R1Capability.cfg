\* Two capabilities and two gateways are the smallest instance that can
\* exhibit the multi-gateway registration R1 permits.
CONSTANTS
    Capabilities = {c1, c2}
    Gateways = {g1, g2}
    Endpoints = {e1}
    NoEndpoint = none

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AtMostOncePerGateway
