\* Six windows is enough to run several rotations past the point where the
\* oldest secret starts being dropped, which is where the bounds bite. Two
\* accepted windows is the registry's cookie_windows_accepted.
CONSTANT MaxWindow = 6
CONSTANT WindowsAccepted = 2

SPECIFICATION Spec

\* A real responder rotates for as long as it runs; this model stops at
\* MaxWindow, so the final state has nothing enabled. That is the bound, not a
\* defect.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT AtMostAcceptedHeld
INVARIANT HeldAreRecent
INVARIANT NothingVerifiesTooLate
INVARIANT NothingVerifiesEarly

PROPERTY StillGoodAfterOneRotation
