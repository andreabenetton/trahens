\* SPDX-License-Identifier: Apache-2.0
\* Two routes are enough to show that phase and allocation track per route
\* rather than globally.
CONSTANTS
    Routes = {r1, r2}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AllocationIffState

\* An ordering, so it is checked as a property over transitions rather than as
\* an invariant over states. See the comment on OpenOnlyFromReady: the state
\* invariant this replaces could not fail, and did not, when a route was given
\* a path from CANDIDATE straight to OPEN.
PROPERTY OpenAlwaysFromReady
