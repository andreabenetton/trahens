\* Four generations is enough to reach a rekey that happens during an existing
\* overlap, which is the case the accumulation bound is about.
CONSTANT MaxGeneration = 4

SPECIFICATION Spec

\* A real link rekeys indefinitely; this model stops at MaxGeneration, so the
\* final state has nothing enabled. That is the bound, not a defect, and the
\* invariants are what this model is for.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT RetiredNeverReturns
INVARIANT AtMostTwoUsable
INVARIANT OverlapIsImmediatelyPrior
INVARIANT CurrentIsUsable
