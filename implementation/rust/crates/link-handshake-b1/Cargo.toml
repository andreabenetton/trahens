[package]
name = "link-handshake-b1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
protocol-registry = { path = "../protocol-registry" }
trahens-crypto = { path = "../crypto" }

[lints]
workspace = true

[dev-dependencies]
test-vectors = { path = "../test-vectors" }
# Independent Noise implementation, tests only. The published vectors come
# from the Python reference; cross-checking them against a second
# implementation is what stops a mistake in that reference from being
# inherited by everything built on it. Never a runtime dependency.
snow = "0.10"
hex = "0.4"
