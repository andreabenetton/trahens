[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trahens-sim"
version = "1.4.1"
description = "Deterministic Trahens research models with R1 rendezvous, multiplicatively blinded reply keys, M2/W2 framing, T1 recovery, T2 scheduling, and T3/T4 traffic analysis"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]
authors = [{name = "Andrea Benetton", email = "andrea.benetton@blueteam.ee"}]

[project.scripts]
trahens-sim = "trahens_sim.cli:main"
trahens-expanding = "trahens_sim.expanding_cli:main"
trahens-policy-compare = "trahens_sim.policy_compare:main"
trahens-unlinkability-compare = "trahens_sim.unlinkability_compare:main"
trahens-lifecycle-compare = "trahens_sim.lifecycle_compare:main"
trahens-fragmentation-compare = "trahens_sim.fragmentation_compare:main"
trahens-c2-compare = "trahens_sim.c2_compare:main"
trahens-r1-compare = "trahens_sim.r1_compare:main"
trahens-t1-compare = "trahens_sim.t1_compare:main"
trahens-t2-compare = "trahens_sim.t2_compare:main"
trahens-t3-compare = "trahens_sim.t3_compare:main"
trahens-t4-compare = "trahens_sim.t4_compare:main"

[tool.setuptools]
package-dir = {"" = "simulator"}

[tool.setuptools.packages.find]
where = ["simulator"]
