name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q simulator
      - name: Run tests
        run: make test
      - name: Run repository smoke checks
        run: ./tools/check_repo.sh
