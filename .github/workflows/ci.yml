name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_captures:
        description: >-
          Upload the linux-interop packet captures and metrics as an
          artifact. Off by default: the captures are large and the job's
          own assertions, not the pcaps, are what the P1 gate rests on.
          Turn this on only when a capture is actually going to be read.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reference-and-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install reference dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      # check_repo.sh ends with cargo test when cargo is present, and it always
      # is on the hosted runner, so this job links trahens-crypto against
      # libsodium exactly like the rust job does.
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Run registry, vector, model, and reference checks
        run: ./tools/check_repo.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: clippy
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Enforce denied clippy lints
        run: cargo clippy --manifest-path implementation/rust/Cargo.toml --all-targets --locked
      - name: Build and test all Rust targets
        run: cargo test --manifest-path implementation/rust/Cargo.toml --all-targets --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not pinned to the 1.82 shipped-code floor: the fuzz crate's locked
      # dependencies (getrandom, jobserver) declare MSRV 1.85, and cargo-fuzz
      # needs nightly to build instrumented binaries anyway. Nothing here ships,
      # so this only has to type-check on a toolchain the tree can resolve.
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Type-check the excluded fuzz crate
        run: cargo check --manifest-path implementation/rust/fuzz/Cargo.toml --all-targets --locked

  linux-interop:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev iproute2 tcpdump time
          python -m pip install cryptography
      - name: Build P1 processes
        run: cargo build --release --manifest-path implementation/rust/Cargo.toml --locked
      - name: Direct two-process interoperability
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 0 --loss 0 --delay 2ms --jitter 0ms \
            --timeout-ms 45000 --output "$GITHUB_WORKSPACE/build/p1-direct"
      - name: Two-relay interoperability with 5 percent loss
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 5 --delay 8ms --jitter 2ms \
            --timeout-ms 60000 --output "$GITHUB_WORKSPACE/build/p1-loss-5"
      # The CANDIDATE blob grows by roughly one relay layer per hop and only
      # exceeds the 992-byte fragment payload from about four relays, so the
      # 2-relay arm above recovers single-fragment messages only. This arm is
      # the one that exercises selective-ACK recovery of a partial fragment
      # set on the wire.
      - name: Five-relay multi-fragment recovery with 5 percent loss
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 5 --loss 5 --delay 8ms --jitter 2ms \
            --timeout-ms 90000 --output "$GITHUB_WORKSPACE/build/p1-multifragment"
      # Gate line: capability replay, wrong-gateway use, and expiry are
      # rejected. Each arm additionally asserts every node reclaimed its state.
      - name: Capability replay is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario replay \
            --timeout-ms 12000 --output "$GITHUB_WORKSPACE/build/p1-replay"
      - name: Unregistered capability is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario wrong-capability \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-wrong-capability"
      - name: Expired capability is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario expired-capability \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-expired-capability"
      # Gate line: success, cancellation, timeout, and transport failure all
      # reclaim remote state.
      - name: A restart cannot reuse a link epoch
        run: sudo -E OUTPUT="$GITHUB_WORKSPACE/build/p1-restart" implementation/harness/netns-restart.sh
      - name: A peer whose static key is not the pinned one is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --scenario wrong-pin \
            --timeout-ms 15000 --output "$GITHUB_WORKSPACE/build/p1-wrong-pin"
      - name: A link rekeys under live traffic without disturbing the route
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 5 --scenario rekey --timeout-ms 25000 \
            --output "$GITHUB_WORKSPACE/build/p1-rekey"
      - name: Descriptor-unauthorized gateway pseudonym is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --scenario unauthorized-pseudonym \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-unauthorized-pseudonym"
      - name: Exhausted ring schedule terminates with NO_CANDIDATE
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario no-candidate \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-no-candidate"
      - name: Transport failure reclaims all remote state
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario transport-failure \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-transport-failure"
      # Gate line: configured burst loss reaches retry exhaustion cleanly.
      - name: Burst loss reaches retry exhaustion cleanly
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --scenario burst-loss --delay 8ms --jitter 2ms \
            --timeout-ms 30000 --output "$GITHUB_WORKSPACE/build/p1-burst-loss"
      # Gate line: off-route subtree cancellation under fan-out. A relay with
      # two children returns two competing candidates; the initiator selects
      # one, and the arm asserts the losing subtree is released rather than
      # left running to its own expiry.
      - name: Fan-out selection cancels the off-route subtree
        run: |
          sudo -E implementation/harness/netns-fanout.sh \
            --loss 0 --delay 2ms --jitter 0ms \
            --timeout-ms 30000 --output "$GITHUB_WORKSPACE/build/p1-fanout"
      - name: Twelve-relay establishment and cleanup
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 12 --loss 0 --delay 2ms --jitter 1ms \
            --timeout-ms 90000 --output "$GITHUB_WORKSPACE/build/p1-12-hop"
      # Experimental analysis profile, deliberately its own arm. An adaptive
      # run renegotiates its cadence, so it must never be cited as evidence for
      # the fixed-trace claim; the harness refuses to assert that claim when
      # this profile is selected. What it does assert is that negotiation
      # happened and stayed within its rules, which local-only runs could not
      # protect against regressing.
      - name: Adaptive T2 negotiates within its rules
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 5 --delay 8ms --jitter 2ms \
            --schedule-profile adaptive \
            --timeout-ms 60000 --output "$GITHUB_WORKSPACE/build/p1-adaptive"
      # Experimental eligibility profile. C1 replaces the inert R1 nonce with a
      # universal re-encryption capsule: relays rerandomise it without learning
      # anything, and only the recipient can tell a discovery is for it. Both
      # arms matter — the negative one proves the gateway declines rather than
      # serving everyone.
      - name: C1 eligibility serves the intended recipient
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms \
            --eligibility-suite c1 \
            --timeout-ms 45000 --output "$GITHUB_WORKSPACE/build/p1-c1"
      - name: C1 eligibility declines everyone else
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms \
            --scenario c1-not-eligible \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-c1-declined"
      # Opt-in only. Every assertion above fails the job on its own, so a
      # red run is already diagnosable from the log; the captures are for
      # reading a packet trace by hand, which is rare and deliberate.
      # Re-run this workflow from the Actions tab with upload_captures set
      # when that is what you want.
      - name: Upload captures and metrics
        if: always() && inputs.upload_captures
        uses: actions/upload-artifact@v7
        with:
          name: p1-network-results
          path: build/p1-*
          retention-days: 5

  # The P1 gate requires decoder fuzzing to complete without crash or
  # unbounded allocation. The conformance crate's deterministic mutation smoke
  # test is not fuzzing; this job runs the real cargo-fuzz targets under a
  # fixed budget. Nightly is required because cargo-fuzz builds with
  # sanitizers, and the fuzz crate's dependencies exceed the 1.82 build floor.
  fuzz-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the M2 decoder
        working-directory: implementation/rust
        run: cargo fuzz run m2 -- -max_total_time=120 -max_len=2048 -rss_limit_mb=2048
      - name: Fuzz the W2 decoder
        working-directory: implementation/rust
        run: cargo fuzz run w2 -- -max_total_time=120 -max_len=2048 -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: implementation/rust/fuzz/artifacts

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned separately from the 1.82 build floor: rustfmt output differs
      # between toolchain versions, so the checker must match the version the
      # tree was formatted with rather than track the MSRV or stable.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --manifest-path implementation/rust/Cargo.toml --all --check
      - name: Check fuzz crate formatting
        run: cargo fmt --manifest-path implementation/rust/fuzz/Cargo.toml --all --check

  # Excluded from the workspace, like the fuzz crate and for the same reason:
  # snow's dependency tree exceeds the 1.82 build floor. It runs on stable so
  # the workspace keeps both its floor and its libsodium-only dependency set,
  # while the published handshake vectors are still checked against a second
  # Noise implementation on every push.
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cross-check the B1.1 vectors against an independent Noise implementation
        run: cargo test --manifest-path implementation/rust/crosscheck/Cargo.toml

  # The TLA+ models were committed but never executed by any pipeline, so a
  # property could be weakened -- or become vacuous -- without anything
  # failing. TLC exits 12 on an invariant violation and 0 on success, so these
  # steps gate on the models rather than merely on the files existing.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned by tag and verified by digest: which states TLC explores depends
      # on the checker version, so an unpinned jar would silently change what
      # the invariants were checked against. Java is preinstalled on the runner.
      - name: Install TLA+ tools
        run: |
          curl -fsSL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" \
            | sha256sum --check --strict
      - name: Check the R1 capability model
        working-directory: formal
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config R1Capability.cfg R1Capability.tla
      - name: Check the E1 lifecycle model
        working-directory: formal
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config E1Lifecycle.cfg E1Lifecycle.tla
      - name: Check the B1 rekey overlap model
        working-directory: formal
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config B1Rekey.cfg B1Rekey.tla

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-pictures \
            texlive-plain-generic \
            texlive-lang-english
      - name: Build the current paper
        run: make paper
      - name: Upload built paper
        uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: build/paper/main.pdf
