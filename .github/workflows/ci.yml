name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-and-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install reference dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      # check_repo.sh ends with cargo test when cargo is present, and it always
      # is on the hosted runner, so this job links trahens-crypto against
      # libsodium exactly like the rust job does.
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Run registry, vector, model, and reference checks
        run: ./tools/check_repo.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: clippy
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Enforce denied clippy lints
        run: cargo clippy --manifest-path implementation/rust/Cargo.toml --all-targets --locked
      - name: Build and test all Rust targets
        run: cargo test --manifest-path implementation/rust/Cargo.toml --all-targets --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Not pinned to the 1.82 shipped-code floor: the fuzz crate's locked
      # dependencies (getrandom, jobserver) declare MSRV 1.85, and cargo-fuzz
      # needs nightly to build instrumented binaries anyway. Nothing here ships,
      # so this only has to type-check on a toolchain the tree can resolve.
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Type-check the excluded fuzz crate
        run: cargo check --manifest-path implementation/rust/fuzz/Cargo.toml --all-targets --locked

  linux-interop:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev iproute2 tcpdump time
          python -m pip install cryptography
      - name: Build P1 processes
        run: cargo build --release --manifest-path implementation/rust/Cargo.toml --locked
      - name: Direct two-process interoperability
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 0 --loss 0 --delay 2ms --jitter 0ms \
            --timeout-ms 45000 --output "$GITHUB_WORKSPACE/build/p1-direct"
      - name: Two-relay interoperability with 5 percent loss
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 5 --delay 8ms --jitter 2ms \
            --timeout-ms 60000 --output "$GITHUB_WORKSPACE/build/p1-loss-5"
      # The CANDIDATE blob grows by roughly one relay layer per hop and only
      # exceeds the 992-byte fragment payload from about four relays, so the
      # 2-relay arm above recovers single-fragment messages only. This arm is
      # the one that exercises selective-ACK recovery of a partial fragment
      # set on the wire.
      - name: Five-relay multi-fragment recovery with 5 percent loss
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 5 --loss 5 --delay 8ms --jitter 2ms \
            --timeout-ms 90000 --output "$GITHUB_WORKSPACE/build/p1-multifragment"
      # Gate line: capability replay, wrong-gateway use, and expiry are
      # rejected. Each arm additionally asserts every node reclaimed its state.
      - name: Capability replay is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario replay \
            --timeout-ms 12000 --output "$GITHUB_WORKSPACE/build/p1-replay"
      - name: Unregistered capability is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario wrong-capability \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-wrong-capability"
      - name: Expired capability is refused
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 2 --loss 0 --delay 2ms --jitter 0ms --scenario expired-capability \
            --timeout-ms 20000 --output "$GITHUB_WORKSPACE/build/p1-expired-capability"
      - name: Twelve-relay establishment and cleanup
        run: |
          sudo -E implementation/harness/netns-p1.sh \
            --relays 12 --loss 0 --delay 2ms --jitter 1ms \
            --timeout-ms 90000 --output "$GITHUB_WORKSPACE/build/p1-12-hop"
      - name: Upload captures and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p1-network-results
          path: build/p1-*

  # The P1 gate requires decoder fuzzing to complete without crash or
  # unbounded allocation. The conformance crate's deterministic mutation smoke
  # test is not fuzzing; this job runs the real cargo-fuzz targets under a
  # fixed budget. Nightly is required because cargo-fuzz builds with
  # sanitizers, and the fuzz crate's dependencies exceed the 1.82 build floor.
  fuzz-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the M2 decoder
        working-directory: implementation/rust
        run: cargo fuzz run m2 -- -max_total_time=120 -max_len=2048 -rss_limit_mb=2048
      - name: Fuzz the W2 decoder
        working-directory: implementation/rust
        run: cargo fuzz run w2 -- -max_total_time=120 -max_len=2048 -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: implementation/rust/fuzz/artifacts

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned separately from the 1.82 build floor: rustfmt output differs
      # between toolchain versions, so the checker must match the version the
      # tree was formatted with rather than track the MSRV or stable.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --manifest-path implementation/rust/Cargo.toml --all --check
      - name: Check fuzz crate formatting
        run: cargo fmt --manifest-path implementation/rust/fuzz/Cargo.toml --all --check

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-pictures \
            texlive-plain-generic \
            texlive-lang-english
      - name: Build the current paper
        run: make paper
      - name: Upload built paper
        uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: build/paper/main.pdf
